name: schedule
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pdfplumber
      - name: Run
        run: python schedule_pdf.py
        env:
          TZ_NAME: Europe/Moscow
      - name: Save result
        run: |
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.txt schedule.json debug.txt
          git diff --cached --quiet || (git commit -m "update schedule" && git push)
          
